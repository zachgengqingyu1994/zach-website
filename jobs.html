<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热招机会 | 扎克耿</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root { --accent: #bfa87a; --bg: #030508; }
body { font-family:'Inter', sans-serif; background-color: var(--bg); color: #94a3b8; margin: 0; overflow-x: hidden; cursor: none; }
/* 动态背景同上 */
.ambient-background { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; background: #030508; overflow: hidden; }
.ambient-glow-blue { position: absolute; width: 150vw; height: 150vh; top: -25%; left: -25%; background: radial-gradient(circle, rgba(16, 40, 90, 0.4) 0%, transparent 65%); animation: drift 25s infinite alternate ease-in-out; }
.architect-grid { position: absolute; bottom: -30%; left: -50%; width: 200%; height: 80%; background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 50px 50px; transform: perspective(600px) rotateX(75deg); animation: grid 15s linear infinite; mask-image: radial-gradient(ellipse at bottom, black 10%, transparent 60%); }
@keyframes drift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(5%, 5%) scale(1.1); } }
@keyframes grid { from { background-position: 0 0; } to { background-position: 0 50px; } }
.cursor-glow { position: fixed; width: 400px; height: 400px; background: radial-gradient(circle, rgba(191,168,122,0.15) 0%, transparent 70%); border-radius: 50%; pointer-events: none; z-index: 999; transform: translate(-50%, -50%); mix-blend-mode: screen; }
.container { max-width: 1000px; margin: 150px auto; padding: 0 24px; position: relative; }
.main-title { font-family: 'Playfair Display'; font-size: 3.5rem; color: #fff; margin-bottom: 60px; }
.jobs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
.job-card {
background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 30px; border-radius: 4px;
position: relative; overflow: hidden; transition: 0.5s; backdrop-filter: blur(10px);
}
.job-card::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 1px; background: var(--accent); transition: 0.5s; }
.job-card:hover { border-color: var(--accent); transform: translateY(-5px); background: rgba(191,168,122,0.03); }
.job-card:hover::after { left: 100%; }
.job-id { font-family: 'Space Mono'; font-size: 10px; color: var(--accent); margin-bottom: 20px; display: block; }
.job-title { font-size: 1.25rem; color: #fff; margin-bottom: 15px; line-height: 1.4; }
.salary { font-family: 'Space Mono'; color: #fff; display: block; margin-top: 25px; font-weight: bold; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
.nav { position: fixed; top: 0; width: 100%; height: 80px; display: flex; align-items: center; justify-content: space-between; padding: 0 50px; box-sizing: border-box; z-index: 1000; background: rgba(3,5,8,0.5); backdrop-filter: blur(10px); }
.logo { font-family: 'Space Mono'; font-weight: bold; color: var(--accent); letter-spacing: 2px; }
</style>
</head>
<body>
<div class="cursor-glow"></div>
<div class="ambient-background">
<div class="ambient-glow-blue"></div>
<div class="architect-grid"></div>
</div>
<nav class="nav">
<div class="logo">ZACH.GENG</div>
<div style="color:#fff; font-size:12px; font-family:'Space Mono'; letter-spacing:2px;">[ TALENT_ACCESS ]</div>
</nav>
<div class="container">
<div style="font-family:'Space Mono'; color:var(--accent); font-size:12px; margin-bottom:15px;">/ LIVE_OPPORTUNITIES</div>
<h1 class="main-title">热招机会</h1>
<div class="jobs-grid">
<div class="job-card">
<span class="job-id">#JOB_AI_INFRA_01</span>
<h3 class="job-title">AI Infra 首席架构师<br>(基座模型方向)</h3>
<p style="font-size:14px; font-weight:300;">主导万卡规模算力底座的通信优化。我们需要你对算力 ROI 有极深的商业直觉。</p>
<span class="salary">1.5M - 2.5M+</span>
</div>
<div class="job-card">
<span class="job-id">#JOB_AGENT_02</span>
<h3 class="job-title">AI Agent 产品合伙人<br>(ToB 生产力)</h3>
<p style="font-size:14px; font-weight:300;">定义新一代 Agent 工作流。寻找具备千万级 DAU 操盘经验的产品先锋。</p>
<span class="salary">OPEN_NEGOTIATION</span>
</div>
</div>
</div>
<script>
const glow = document.querySelector('.cursor-glow');
document.addEventListener('mousemove', e => {
glow.style.left = e.clientX + 'px';
glow.style.top = e.clientY + 'px';
});
</script>
</body>
</html>
