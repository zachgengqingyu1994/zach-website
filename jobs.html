<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热招岗位 | 扎克耿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --gold: #D4AF37; --gold-light: #F4D03F; --gold-glow: rgba(212,175,55,0.3);
            --black: #0a0a0a; --black-light: #1a1a1a; --black-lighter: #2a2a2a;
            --text-muted: #888; --text-body: #ccc; --radius: 14px;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--black); color: #fff; min-height: 100vh;
            background-image:
                radial-gradient(ellipse 70% 40% at 50% 0%, rgba(212,175,55,0.08) 0%, transparent 60%),
                radial-gradient(ellipse 50% 30% at 80% 20%, rgba(212,175,55,0.05) 0%, transparent 50%);
        }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 24px 60px; position: relative; z-index: 1; }

        .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; animation: fadeUp 0.6s ease-out both; }
        .back { display: inline-flex; align-items: center; gap: 6px; color: var(--gold); text-decoration: none; font-size: 0.95rem; transition: gap 0.3s; }
        .back:hover { gap: 12px; color: var(--gold-light); }

        header { text-align: center; margin-bottom: 40px; animation: fadeUp 0.6s ease-out 0.15s both; }
        h1 { font-size: 2.2rem; background: linear-gradient(135deg, var(--gold-light), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-top: 8px; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* 筛选栏 */
        .filter-bar {
            display: flex; gap: 10px; flex-wrap: wrap;
            margin-bottom: 30px;
            animation: fadeUp 0.6s ease-out 0.2s both;
        }
        .filter-btn {
            padding: 6px 16px; border-radius: 20px;
            background: var(--black-light); border: 1px solid var(--black-lighter);
            color: #888; cursor: pointer; font-size: 0.85rem;
            transition: all 0.3s; font-family: inherit;
        }
        .filter-btn:hover { border-color: var(--gold); color: var(--gold); }
        .filter-btn.active { background: rgba(212,175,55,0.15); border-color: var(--gold); color: var(--gold); }

        .jobs-list { display: flex; flex-direction: column; gap: 16px; }

        .job-card {
            background: var(--black-light); border: 1px solid var(--black-lighter);
            border-radius: var(--radius); padding: 24px 28px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: fadeUp 0.5s ease-out var(--delay, 0.3s) both;
            position: relative; overflow: hidden;
        }
        .job-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: linear-gradient(to bottom, var(--gold), transparent);
            opacity: 0; transition: opacity 0.4s;
        }
        .job-card:hover::before { opacity: 1; }
        .job-card:hover {
            transform: translateY(-4px); border-color: var(--gold);
            box-shadow: 0 8px 30px rgba(212,175,55,0.1);
        }

        .job-card:nth-child(1) { --delay: 0.3s; }
        .job-card:nth-child(2) { --delay: 0.4s; }
        .job-card:nth-child(3) { --delay: 0.5s; }
        .job-card:nth-child(4) { --delay: 0.6s; }
        .job-card:nth-child(5) { --delay: 0.7s; }

        .job-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
        .job-title { font-size: 1.15rem; font-weight: 600; color: #fff; }
        .job-card:hover .job-title { color: var(--gold); }
        .job-badge { display: inline-block; background: rgba(212,175,55,0.15); color: var(--gold); padding: 3px 14px; border-radius: 20px; font-size: 0.78rem; border: 1px solid rgba(212,175,55,0.2); white-space: nowrap; }

        .job-company { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px; }
        .job-dot { width: 4px; height: 4px; background: #555; border-radius: 50%; }

        .job-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .job-tag { background: rgba(255,255,255,0.05); color: #777; padding: 3px 10px; border-radius: 6px; font-size: 0.78rem; }

        .job-desc { color: var(--text-muted); font-size: 0.88rem; line-height: 1.7; }

        .job-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--black-lighter); }
        .job-salary { color: var(--gold); font-weight: 600; font-size: 0.95rem; }
        .job-action { color: var(--text-muted); font-size: 0.8rem; text-decoration: none; transition: color 0.3s; }
        .job-action:hover { color: var(--gold); }

        .empty-state {
            text-align: center; padding: 80px 20px; color: #555;
            background: var(--black-light); border: 1px dashed var(--black-lighter);
            border-radius: var(--radius); animation: fadeUp 0.6s ease-out 0.3s both;
        }
        .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
        .empty-state p { font-size: 1rem; margin-bottom: 8px; }
        .empty-state .hint { font-size: 0.85rem; color: #444; }

        .footer { text-align: center; margin-top: 60px; color: #333; font-size: 0.8rem; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--black); }
        ::-webkit-scrollbar-thumb { background: var(--black-lighter); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

        @media (max-width: 600px) {
            .container { padding: 24px 16px 40px; }
            h1 { font-size: 1.6rem; }
            .job-card { padding: 18px 20px; }
            .job-header { flex-direction: column; }
            .job-title { font-size: 1.05rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="index.html" class="back">← 返回首页</a>
        </div>

        <header>
            <h1>🔥 热招岗位</h1>
            <p class="subtitle">AI & 科技领域优质机会</p>
        </header>

        <div class="empty-state">
            <div class="icon">🚀</div>
            <p>暂无热招岗位</p>
            <p class="hint">优质岗位即将上线，敬请关注</p>
        </div>

        <div class="footer">⚡ 2026 扎克耿</div>
    </div>

    <script>
        // 后续：可通过 API 动态加载岗位数据，支持筛选/搜索
    </script>
</body>
</html>
