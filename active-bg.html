<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebGL Particle Fluid Engine</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background-color: #050505;
overflow: hidden;
width: 100vw;
height: 100vh;
}
#webgl-container {
position: absolute;
top: 0; left: 0;
width: 100%; height: 100%;
z-index: 1;
}
#ui-layer {
position: absolute; top: 0; left: 0; width: 100%; height: 100%;
z-index: 10; pointer-events: none;
display: flex; flex-direction: column; justify-content: space-between;
padding: 40px; color: #fff; font-family: monospace; font-size: 12px; letter-spacing: 2px;
}
.header, .footer { display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div id="webgl-container"></div>
<div id="ui-layer">
<div class="header">
<div>A/T</div>
<div>MENU</div>
</div>
<div class="footer">
<div>FLUID PARTICLE ENGINE</div>
<div>[ WEBGL EXPERIMENT ]</div>
</div>
</div>
<script>
// ==========================================
// 1. 初始化 Three.js 场景、相机和渲染器
// ==========================================
const container = document.getElementById('webgl-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 160;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);
// ==========================================
// 2. 构建海量粒子数据源
// ==========================================
const particleCount = 25000;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const randoms = new Float32Array(particleCount);
const colors = new Float32Array(particleCount * 3);
const colorMagenta = new THREE.Color('#ff0055');
const colorCyan = new THREE.Color('#00d2ff');
const colorWhite = new THREE.Color('#ffffff');
for (let i = 0; i < particleCount; i++) {
const r = 100 * Math.cbrt(Math.random());
const theta = Math.random() * 2 * Math.PI;
const phi = Math.acos(2 * Math.random() - 1);
positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
positions[i * 3 + 2] = r * Math.cos(phi);
randoms[i] = Math.random();
const mix = Math.random();
let finalColor = colorMagenta;
if(mix > 0.5) finalColor = colorCyan;
if(mix > 0.85) finalColor = colorWhite;
colors[i * 3] = finalColor.r;
colors[i * 3 + 1] = finalColor.g;
colors[i * 3 + 2] = finalColor.b;
}
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
// ==========================================
// 3. 核心魔法：GPU 着色器 (Shaders)
// ==========================================
const material = new THREE.ShaderMaterial({
uniforms: {
uTime: { value: 0 }
},
vertexShader: `
uniform float uTime;
attribute float aRandom;
varying vec3 vColor;
void main() {
vColor = color;
vec3 pos = position;
float twist = sin(pos.y * 0.05 + uTime * 0.4) * 15.0;
pos.x += sin(uTime * 0.3 + aRandom * 10.0) * twist;
pos.z += cos(uTime * 0.4 + aRandom * 10.0) * twist;
pos *= 1.0 + sin(uTime * 0.8 + aRandom) * 0.15;
vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
gl_PointSize = (45.0 * aRandom + 10.0) * (150.0 / -mvPosition.z);
gl_Position = projectionMatrix * mvPosition;
}
`,
fragmentShader: `
varying vec3 vColor;
void main() {
vec2 xy = gl_PointCoord.xy - vec2(0.5);
float ll = length(xy);
if(ll > 0.5) discard;
float alpha = pow(1.0 - (ll * 2.0), 1.2);
gl_FragColor = vec4(vColor, alpha * 0.8);
}
`,
transparent: true,
blending: THREE.AdditiveBlending,
depthWrite: false
});
const particleSystem = new THREE.Points(geometry, material);
scene.add(particleSystem);
// ==========================================
// 4. 丝滑鼠标视差跟随
// ==========================================
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;
document.addEventListener('mousemove', (event) => {
mouseX = (event.clientX / window.innerWidth) * 2 - 1;
mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
});
// ==========================================
// 5. 渲染循环
// ==========================================
const clock = new THREE.Clock();
function animate() {
requestAnimationFrame(animate);
const time = clock.getElapsedTime();
material.uniforms.uTime.value = time;
targetX += (mouseX - targetX) * 0.05;
targetY += (mouseY - targetY) * 0.05;
particleSystem.rotation.y = time * 0.08 + targetX * 0.6;
particleSystem.rotation.x = targetY * 0.4;
renderer.render(scene, camera);
}
animate();
// ==========================================
// 6. 窗口自适应
// ==========================================
window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
