<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扎克耿 | AI 猎头</title>
    <style>
        /* ============================================
           CSS 变量 & 重置
           ============================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --gold:         #D4AF37;
            --gold-light:   #F4D03F;
            --gold-glow:    rgba(212,175,55,0.3);
            --black:        #0a0a0a;
            --black-light:  #1a1a1a;
            --black-lighter:#2a2a2a;
            --text-muted:   #888;
            --text-body:    #ccc;
            --radius:       16px;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--black);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% 0%, rgba(212,175,55,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(212,175,55,0.06) 0%, transparent 50%);
        }

        /* ============================================
           粒子背景
           ============================================ */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0;
            animation: floatUp var(--dur, 6s) ease-out var(--delay, 0s) infinite;
        }
        @keyframes floatUp {
            0%   { transform: translateY(100vh) scale(0); opacity: 0; }
            20%  { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ============================================
           容器
           ============================================ */
        .container {
            position: relative;
            z-index: 1;
            max-width: 880px;
            margin: 0 auto;
            padding: 60px 24px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* ============================================
           头像 — 呼吸 + 旋转光晕
           ============================================ */
        .avatar-wrapper {
            width: 180px;
            height: 180px;
            margin: 0 auto 30px;
            position: relative;
        }
        .avatar-wrapper::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, var(--gold), transparent 60%, var(--gold-light) 80%, transparent);
            animation: spin 4s linear infinite;
            mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #fff calc(100% - 1px));
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #fff calc(100% - 1px));
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: url('alpaca.png') center/cover;
            position: relative;
            z-index: 1;
            animation: breathe 4s ease-in-out infinite;
            box-shadow: 0 0 40px var(--gold-glow);
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px var(--gold-glow); }
            50%      { transform: scale(1.04); box-shadow: 0 0 80px var(--gold-glow); }
        }

        /* ============================================
           标题 & 副标题 — 渐入 + 打字光标
           ============================================ */
        .hero {
            text-align: center;
            animation: fadeUp 0.8s ease-out 0.2s both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.4rem;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), #b8860b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .tagline {
            font-size: 1.05rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            margin-bottom: 6px;
        }

        .typed-cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: var(--gold);
            margin-left: 4px;
            animation: blink 0.8s step-end infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .sub-text {
            color: #666;
            font-size: 0.9rem;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* ============================================
           导航网格
           ============================================ */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-top: 50px;
            animation: fadeUp 0.8s ease-out 0.5s both;
        }

        .nav-item {
            background: var(--black-light);
            border: 1px solid var(--black-lighter);
            border-radius: var(--radius);
            padding: 30px 16px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        /* 悬停光效 */
        .nav-item::before {
            content: '';
            position: absolute;
            top: var(--mouse-y, 50%);
            left: var(--mouse-x, 50%);
            width: 0;
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212,175,55,0.2), transparent 70%);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
            pointer-events: none;
        }
        .nav-item:hover::before {
            width: 400px;
            height: 400px;
        }

        .nav-item:hover {
            transform: translateY(-6px) scale(1.03);
            border-color: var(--gold);
            box-shadow:
                0 12px 40px rgba(212,175,55,0.15),
                inset 0 0 30px rgba(212,175,55,0.05);
        }

        .nav-item:active {
            transform: translateY(-2px) scale(1.01);
        }

        .nav-icon {
            font-size: 2.2rem;
            display: block;
            margin-bottom: 12px;
            transition: transform 0.4s;
        }
        .nav-item:hover .nav-icon {
            transform: scale(1.2) rotate(-5deg);
        }

        .nav-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--gold);
            display: block;
            transition: letter-spacing 0.3s;
        }
        .nav-item:hover .nav-title {
            letter-spacing: 1.5px;
        }

        .nav-desc {
            display: block;
            color: #666;
            font-size: 0.78rem;
            margin-top: 6px;
        }

        /* 卡片顺序动画 */
        .nav-item:nth-child(1) { animation: fadeUp 0.6s ease-out 0.6s both; }
        .nav-item:nth-child(2) { animation: fadeUp 0.6s ease-out 0.7s both; }
        .nav-item:nth-child(3) { animation: fadeUp 0.6s ease-out 0.8s both; }
        .nav-item:nth-child(4) { animation: fadeUp 0.6s ease-out 0.9s both; }

        /* ============================================
           页脚
           ============================================ */
        .footer {
            text-align: center;
            margin-top: 60px;
            color: #333;
            font-size: 0.8rem;
            animation: fadeUp 0.8s ease-out 1.1s both;
        }
        .footer span { color: var(--gold); }
        .footer .heart { display: inline-block; animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.3); }
        }

        /* ============================================
           页面滚动进度条
           ============================================ */
        .scroll-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
            z-index: 999;
            width: 0%;
            transition: width 0.1s;
        }

        /* ============================================
           响应式
           ============================================ */
        @media (max-width: 768px) {
            .container { padding: 40px 16px; justify-content: flex-start; padding-top: 80px; }
            h1 { font-size: 1.7rem; }
            .tagline { font-size: 0.9rem; letter-spacing: 2px; }
            .avatar-wrapper { width: 130px; height: 130px; }
            .nav-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 40px; }
            .nav-item { padding: 22px 12px; }
            .nav-icon { font-size: 1.8rem; }
            .nav-title { font-size: 0.95rem; }
        }

        @media (max-width: 420px) {
            h1 { font-size: 1.4rem; }
            .avatar-wrapper { width: 110px; height: 110px; }
            .nav-grid { gap: 10px; }
            .nav-item { padding: 18px 10px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }

        /* ============================================
           自定义滚动条
           ============================================ */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--black); }
        ::-webkit-scrollbar-thumb { background: var(--black-lighter); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }
    </style>
</head>
<body>

    <!-- 滚动进度条 -->
    <div class="scroll-bar" id="scrollBar"></div>

    <!-- 粒子背景 -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="hero">
            <div class="avatar-wrapper">
                <div class="avatar"></div>
            </div>
            <h1>你好，我是扎克耿</h1>
            <p class="tagline">
                一个进化中的 AI 猎头
                <span class="typed-cursor"></span>
            </p>
            <p class="sub-text">好奇技术发展 · 想象突破天际 · 拒绝循规蹈矩</p>
        </div>

        <div class="nav-grid">
            <a href="blog.html" class="nav-item">
                <span class="nav-icon">📝</span>
                <span class="nav-title">个人博客</span>
                <span class="nav-desc">思考 &amp; 记录</span>
            </a>
            <a href="news.html" class="nav-item">
                <span class="nav-icon">📰</span>
                <span class="nav-title">每日新闻</span>
                <span class="nav-desc">行业动态</span>
            </a>
            <a href="jobs.html" class="nav-item">
                <span class="nav-icon">🔥</span>
                <span class="nav-title">热招岗位</span>
                <span class="nav-desc">机会在这里</span>
            </a>
            <a href="about.html" class="nav-item">
                <span class="nav-icon">👤</span>
                <span class="nav-title">关于本人</span>
                <span class="nav-desc">了解更多</span>
            </a>
        </div>

        <div class="footer">
            <span class="heart">⚡</span>
            2026 扎克耿 · All Rights Reserved
        </div>
    </div>

    <script>
        // ============================================
        // 粒子生成
        // ============================================
        (function initParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const el = document.createElement('div');
                el.className = 'particle';
                el.style.left = Math.random() * 100 + '%';
                el.style.setProperty('--dur', (5 + Math.random() * 8) + 's');
                el.style.setProperty('--delay', (Math.random() * 10) + 's');
                el.style.width = el.style.height = (2 + Math.random() * 4) + 'px';
                container.appendChild(el);
            }
        })();

        // ============================================
        // 滚动进度条
        // ============================================
        window.addEventListener('scroll', function() {
            const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
            const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
            document.getElementById('scrollBar').style.width = progress + '%';
        });

        // ============================================
        // 鼠标跟随光效（导航卡片）
        // ============================================
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('mousemove', function(e) {
                const rect = this.getBoundingClientRect();
                this.style.setProperty('--mouse-x', (e.clientX - rect.left) + 'px');
                this.style.setProperty('--mouse-y', (e.clientY - rect.top) + 'px');
            });
        });
    </script>
</body>
</html>
