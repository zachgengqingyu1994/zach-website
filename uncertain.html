// ─── Scene Setup ───
const container = document.getElementById('three-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08080E);
scene.fog = new THREE.FogExp2(0x08080E, 0.003);

const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 500);
camera.position.set(0, -5, 60);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.domElement.style.cssText = 'display: block; width: 100%; height: 100%;';
container.appendChild(renderer.domElement);

// ─── Sky Dome ───
const skyGeo = new THREE.SphereGeometry(200, 40, 40);
const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
        topColor: { value: new THREE.Color(0x1a1a2e) },
        bottomColor: { value: new THREE.Color(0x08080E) },
        offset: { value: 20 },
        exponent: { value: 0.5 }
    },
    vertexShader: `
        varying vec3 vWorldPosition;
        void main() {
            vec4 worldPos = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPos.xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        uniform vec3 topColor;
        uniform vec3 bottomColor;
        uniform float offset;
        uniform float exponent;
        varying vec3 vWorldPosition;
        void main() {
            float h = normalize(vWorldPosition + offset).y;
            gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
        }
    `
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// ─── Ambient Particles ───

const pCol = new Float32Array(particleCount * 3);
const gold = new THREE.Color(0xD4AF37);
const goldLight = new THREE.Color(0xE0C46A);
const blue = new THREE.Color(0x4ECDC4);
const purple = new THREE.Color(0x6C5CE7);
const palette = [gold, goldLight, blue, purple];

for (let i = 0; i < particleCount; i++) {
    const radius = 120 * Math.cbrt(Math.random());
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pPos[i*3] = radius * Math.sin(phi) * Math.cos(theta);
    pPos[i*3+1] = (Math.random() - 0.5) * 60;
    pPos[i*3+2] = radius * Math.sin(phi) * Math.sin(theta);
    const c = palette[Math.floor(Math.random() * palette.length)];
    pCol[i*3] = c.r; pCol[i*3+1] = c.g; pCol[i*3+2] = c.b;
}

const pGeo = new THREE.BufferGeometry();

    const ctx = canvas.getContext('2d');

    // Background
    const grad = ctx.createRadialGradient(240, 160, 0, 240, 160, 240);
    grad.addColorStop(0, 'rgba(20,18,26,0.95)');
    grad.addColorStop(1, 'rgba(8,8,14,0.95)');
    ctx.fillStyle = grad;
    ctx.roundRect(0, 0, 480, 320, 16);
    ctx.fill();

    // Border
    ctx.strokeStyle = 'rgba(212,175,55,0.15)';
    ctx.lineWidth = 1;
    ctx.roundRect(0, 0, 480, 320, 16);
    ctx.stroke();

    // Gold top line
    ctx.strokeStyle = 'rgba(212,175,55,0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(40, 0);
    ctx.lineTo(440, 0);
    ctx.stroke();

    // Title
    ctx.fillStyle = '#F0EDE8';
    ctx.font = '600 18px -apple-system, PingFang SC, sans-serif';
    ctx.textBaseline = 'top';
    const title = job.title.length > 35 ? job.title.slice(0, 32) + '...' : job.title;
    ctx.fillText(title, 28, 28);

    // Company
    ctx.fillStyle = '#D4AF37';
    ctx.font = '12px -apple-system, PingFang SC, sans-serif';
    ctx.fillText('🏢 ' + job.company, 28, 62);

    // Location
    ctx.fillStyle = '#6B6966';
    ctx.font = '12px -apple-system, PingFang SC, sans-serif';
    ctx.fillText('📍 ' + job.location, 28, 84);

    // Tags
    const tags = job.tags || [];
    tags.forEach((tag, i) => {
        const x = 28 + i * (70 + 8);
        if (x > 420) return;
        ctx.fillStyle = 'rgba(212,175,55,0.1)';
        ctx.beginPath();
        ctx.roundRect(x, 108, ctx.measureText(tag).width + 20, 22, 6);
        ctx.fill();
        ctx.fillStyle = '#A9A6A0';
        ctx.font = '11px -apple-system, PingFang SC, sans-serif';
        ctx.fillText(tag, x + 10, 113);
    });

    // Description
    ctx.fillStyle = '#8E8E93';
    ctx.font = '13px -apple-system, PingFang SC, sans-serif';
    const desc = job.desc.length > 80 ? job.desc.slice(0, 77) + '...' : job.desc;
    ctx.fillText(desc, 28, 148);

    return new THREE.CanvasTexture(canvas);
}

// Poisson-disk-like distribution
const minDist = 18;
const attempts = 50;

function isValidPosition(pos, existing) {
    for (const e of existing) {
        const dx = pos.x - e.x, dy = pos.y - e.y, dz = pos.z - e.z;
        if (dx*dx + dy*dy + dz*dz < minDist * minDist) return false;
    }
    return true;
}

JOBS.forEach((job, i) => {
    const texture = makeCanvasTexture(job, i);
    texture.needsUpdate = true;
    
    const aspect = 480 / 320;
    const width = 12;
    const height = width / aspect;
    
    const geo = new THREE.PlaneGeometry(width, height);
    const mat = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        opacity: 0.9,
        side: THREE.DoubleSide,
        depthWrite: true
    });
    const mesh = new THREE.Mesh(geo, mat);
    
    // Position with poisson-like distribution
    let pos;
    for (let attempt = 0; attempt < attempts; attempt++) {
        const candidate = {
            x: (Math.random() - 0.5) * 80,
            y: (Math.random() - 0.5) * 50,
            z: (Math.random() - 0.5) * 50 - 15
        };
        if (isValidPosition(candidate, itemPositions)) {
            pos = candidate;
            break;
        }
    }
    if (!pos) {
        pos = {
            x: (Math.random() - 0.5) * 80,
            y: (Math.random() - 0.5) * 50,
            z: (Math.random() - 0.5) * 50 - 15
        };
    }
    itemPositions.push(pos);
    
    mesh.position.set(pos.x, pos.y, pos.z);
    
    // Random rotation
    mesh.rotation.x = (Math.random() - 0.5) * 0.3;
    mesh.rotation.y = (Math.random() - 0.5) * 0.3;
    
    // Store original position for drift
    mesh.userData = {
        origPos: { x: pos.x, y: pos.y, z: pos.z },
        phase: Math.random() * Math.PI * 2,
        speed: 0.3 + Math.random() * 0.3,
        amp: 0.3 + Math.random() * 0.5,
        job: job,
        targetOpacity: 1
    };
    
    itemGroup.add(mesh);
    items.push(mesh);
});

// ─── Controls ───
let isDragging = false;
let previousMouse = { x: 0, y: 0 };
let velocity = { x: 0, y: 0 };
const dampFactor = 0.95;
const sensitivity = 0.003;
let currentMode = 'drift';

container.addEventListener('mousedown', (e) => {
    isDragging = true;
    previousMouse.x = e.clientX;
    previousMouse.y = e.clientY;
});

window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - previousMouse.x;
    const dy = e.clientY - previousMouse.y;
    
    if (currentMode === 'drift') {
        velocity.x += dx * sensitivity;
        velocity.y += dy * sensitivity;
    } else if (currentMode === 'tags') {
        // Rotate around Y for tags mode
        velocity.x += dx * sensitivity;
    }
    
    previousMouse.x = e.clientX;
    previousMouse.y = e.clientY;
});

window.addEventListener('mouseup', () => { isDragging = false; });

container.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomSpeed = 0.8;
    const direction = e.deltaY > 0 ? 1 : -1;
    const newZ = camera.position.z + direction * zoomSpeed;
    camera.position.z = Math.max(15, Math.min(150, newZ));
}, { passive: false });

// Touch support
let touchStart = { x: 0, y: 0 };
container.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
        touchStart.x = e.touches[0].clientX;
        touchStart.y = e.touches[0].clientY;
    }
}, { passive: true });

container.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1) {
        const dx = e.touches[0].clientX - touchStart.x;
        const dy = e.touches[0].clientY - touchStart.y;
        velocity.x += dx * sensitivity;
        velocity.y += dy * sensitivity;
        touchStart.x = e.touches[0].clientX;
        touchStart.y = e.touches[0].clientY;
    }
}, { passive: true });

// ─── Raycaster (Click/Hover) ───
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hoveredItem = null;
let selectedItem = null;

const labelWrapper = document.getElementById('item-label-wrapper');
const labelEl = document.getElementById('item-label');

function onPointerMove(event) {
    const rect = container.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

function onPointerClick(event) {

// ─── Mode Switching ───
const modeLinks = document.querySelectorAll('#view-nav a');
let tagModeActive = false;
let searchModeActive = false;

modeLinks.forEach(link => {
    link.addEventListener('click', (e) => {
        e.preventDefault();
        modeLinks.forEach(l => l.classList.remove('active'));
        link.classList.add('active');

        if (currentMode === 'drift') {

                item.userData.targetOpacity = 1;
            });

            tagModeActive = true;
            searchModeActive = false;
            document.getElementById('search-overlay').classList.remove('open');
            document.getElementById('connections-canvas').classList.add('visible');
            // Group items by tags
            organizeByTags();
        } else if (currentMode === 'search') {
            searchModeActive = true;
            tagModeActive = false;
            document.getElementById('search-overlay').classList.add('open');
            document.getElementById('connections-canvas').classList.remove('visible');
            setTimeout(() => document.getElementById('search-input').focus(), 300);
        }
    });
});

// Tags organization
function organizeByTags() {
    const tagGroups = {};
    JOBS.forEach((job, i) => {
        (job.tags || ['AI']).forEach(tag => {
            if (!tagGroups[tag]) tagGroups[tag] = [];
            tagGroups[tag].push(i);
        });
    });
    
    const tagEntries = Object.entries(tagGroups);
    const angleStep = (Math.PI * 2) / tagEntries.length;
    const tagRadius = 35;
    
    tagEntries.forEach(([tag, indices], i) => {
        const angle = angleStep * i;
        const cx = Math.cos(angle) * tagRadius;
        const cz = Math.sin(angle) * tagRadius;
        
        indices.forEach((itemIdx, j) => {
            const mesh = items[itemIdx];
            const offset = (j - (indices.length - 1) / 2) * 3;
            mesh.userData.targetX = cx + Math.cos(angle + Math.PI/2) * offset;
            mesh.userData.targetY = -offset * 0.5;
            mesh.userData.targetZ = cz + Math.sin(angle + Math.PI/2) * offset;
            mesh.userData.targetOpacity = 0.9;
        });
    });
    
    // Hide items not in any tag
    items.forEach((mesh, idx) => {
        if (!tagEntries.some(([_, indices]) => indices.includes(idx))) {
            mesh.userData.targetOpacity = 0;
        }
    });
}

// Search
document.getElementById('search-input').addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase();
    items.forEach((mesh, i) => {
        const job = mesh.userData.job;
        const match = job.title.toLowerCase().includes(query) || 
                       job.company.toLowerCase().includes(query) ||
                       (job.tags || []).some(t => t.toLowerCase().includes(query));
        mesh.userData.targetOpacity = match || !query ? 0.9 : 0;
    });
});

document.addEventListener('keydown', (e) => {

        document.getElementById('search-overlay').classList.remove('open');

        document.querySelector('#view-nav a[data-mode="drift"]').click();

    if (e.key === '/' && !document.getElementById('search-overlay').classList.contains('open')) {
        e.preventDefault();
        document.querySelector('#view-nav a[data-mode="search"]').click();
    }
});

// ─── Animation Loop ───
const clock = new THREE.Clock();
let time = 0;

function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    time += delta;

    // Drift rotation with momentum
    if (currentMode === 'drift') {
        velocity.x *= dampFactor;
        velocity.y *= dampFactor;
        
        // Rotate item group
        itemGroup.rotation.x += velocity.y;
        itemGroup.rotation.y += velocity.x;
        
        // Gentle auto-rotation
        itemGroup.rotation.y += delta * 0.03;
        
        // Individual item float animation
        items.forEach((mesh, i) => {
            const ud = mesh.userData;
            const floatY = Math.sin(time * ud.speed + ud.phase) * ud.amp;
            mesh.position.y = ud.origPos.y + floatY;
            // Gentle billboard tilt
            mesh.rotation.z = Math.sin(time * ud.speed * 0.5 + ud.phase) * 0.02;
        });
    } else if (currentMode === 'tags') {
        velocity.x *= dampFactor;
        itemGroup.rotation.y += velocity.x;
        
        items.forEach((mesh) => {
            const ud = mesh.userData;
            if (ud.targetX !== undefined) {
                mesh.position.x += (ud.targetX - mesh.position.x) * 0.02;
                mesh.position.y += (ud.targetY - mesh.position.y) * 0.02;
                mesh.position.z += (ud.targetZ - mesh.position.z) * 0.02;
                mesh.lookAt(camera.position);
            }
        });
    }

    // Smooth opacity transitions
    items.forEach((mesh) => {
        const ud = mesh.userData;
        mesh.material.opacity += (ud.targetOpacity - mesh.material.opacity) * 0.05;
    });

    // Particle rotation
    particles.rotation.y += delta * 0.01;

    // Hover detection
    raycaster.setFromCamera(pointer, camera);
    const intersects = raycaster.intersectObjects(items);
    
    if (intersects.length > 0 && currentMode !== 'search') {
        const hit = intersects[0].object;
        if (hoveredItem !== hit) {
            if (hoveredItem) {
                hoveredItem.material.opacity = 0.9;
            }
            hoveredItem = hit;
            hoveredItem.material.opacity = 1;
        }
        // Update label
        const job = hit.userData.job;
        labelEl.textContent = job.title + ' · ' + job.company;
        
        // Position label near mouse
        const rect = container.getBoundingClientRect();
        const mouseX = (pointer.x * 0.5 + 0.5) * rect.width;
        const mouseY = -(pointer.y * 0.5 - 0.5) * rect.height;
        labelWrapper.style.left = (mouseX + 16) + 'px';
        labelWrapper.style.top = (mouseY - 20) + 'px';
        labelWrapper.classList.add('visible');
        container.style.cursor = 'pointer';
    } else {
        if (hoveredItem) {
            hoveredItem.material.opacity = 0.9;
            hoveredItem = null;
        }
        labelWrapper.classList.remove('visible');
        container.style.cursor = 'default';
    }

    renderer.render(scene, camera);
}
