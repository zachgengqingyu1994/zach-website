<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于本人 | 扎克耿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --gold:         #D4AF37;
            --gold-light:   #F4D03F;
            --gold-glow:    rgba(212,175,55,0.3);
            --black:        #0a0a0a;
            --black-light:  #1a1a1a;
            --black-lighter:#2a2a2a;
            --text-muted:   #888;
            --text-body:    #ccc;
            --radius:       14px;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--black);
            color: #fff;
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse 70% 40% at 50% 0%, rgba(212,175,55,0.08) 0%, transparent 60%),
                radial-gradient(ellipse 50% 30% at 20% 80%, rgba(212,175,55,0.05) 0%, transparent 50%);
        }

        /* ============================================
           粒子背景
           ============================================ */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0;
            animation: floatUp var(--dur, 8s) ease-out var(--delay, 0s) infinite;
        }
        @keyframes floatUp {
            0%   { transform: translateY(100vh) scale(0); opacity: 0; }
            20%  { opacity: 0.4; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 24px 60px;
        }

        /* ============================================
           返回 + 标题
           ============================================ */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            animation: fadeUp 0.6s ease-out both;
        }
        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--gold);
            text-decoration: none;
            font-size: 0.95rem;
            transition: gap 0.3s, color 0.3s;
        }
        .back:hover { gap: 12px; color: var(--gold-light); }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeUp 0.6s ease-out 0.15s both;
        }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ============================================
           卡片
           ============================================ */
        .sections {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section {
            background: var(--black-light);
            border: 1px solid var(--black-lighter);
            border-radius: var(--radius);
            padding: 30px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: fadeUp 0.6s ease-out var(--delay, 0.3s) both;
            position: relative;
            overflow: hidden;
        }
        .section:hover {
            transform: translateY(-3px);
            border-color: var(--gold);
            box-shadow: 0 8px 30px rgba(212,175,55,0.1);
        }

        /* 左侧金色装饰条 */
        .section::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(to bottom, var(--gold), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }
        .section:hover::before { opacity: 1; }

        .section:nth-child(1) { --delay: 0.25s; }
        .section:nth-child(2) { --delay: 0.35s; }
        .section:nth-child(3) { --delay: 0.45s; }
        .section:nth-child(4) { --delay: 0.55s; }

        .section h2 {
            color: var(--gold);
            font-size: 1.25rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section h2::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--black-lighter), transparent);
        }

        .section p {
            color: var(--text-body);
            line-height: 1.9;
            font-size: 0.95rem;
        }

        .section ul {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .section ul li {
            color: var(--text-body);
            line-height: 1.7;
            font-size: 0.95rem;
            padding-left: 24px;
            position: relative;
            transition: padding-left 0.3s;
        }
        .section ul li::before {
            content: '✦';
            position: absolute;
            left: 0;
            color: var(--gold);
            font-size: 0.7rem;
            top: 4px;
        }
        .section ul li:hover {
            padding-left: 30px;
            color: #fff;
        }

        /* ============================================
           标签
           ============================================ */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .tag {
            display: inline-block;
            background: rgba(212,175,55,0.12);
            color: var(--gold);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid rgba(212,175,55,0.2);
            transition: all 0.3s;
            cursor: default;
        }
        .tag:hover {
            background: rgba(212,175,55,0.25);
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212,175,55,0.2);
        }

        /* ============================================
           联系方式
           ============================================ */
        .contact {
            text-align: center;
            margin-top: 40px;
            padding: 30px;
            background: var(--black-light);
            border: 1px solid var(--black-lighter);
            border-radius: var(--radius);
            animation: fadeUp 0.6s ease-out 0.65s both;
            transition: border-color 0.4s;
        }
        .contact:hover {
            border-color: var(--gold);
        }
        .contact p {
            color: var(--text-muted);
            font-size: 1rem;
        }
        .contact .emoji {
            font-size: 1.4rem;
            display: block;
            margin-bottom: 10px;
        }

        /* ============================================
           滚动条
           ============================================ */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--black); }
        ::-webkit-scrollbar-thumb { background: var(--black-lighter); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

        /* ============================================
           响应式
           ============================================ */
        @media (max-width: 600px) {
            .container { padding: 24px 16px 40px; }
            h1 { font-size: 1.6rem; }
            .section { padding: 22px; }
            .top-bar { margin-bottom: 24px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>

    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="top-bar">
            <a href="index.html" class="back">← 返回首页</a>
        </div>

        <header>
            <h1>👤 关于本人</h1>
        </header>

        <div class="sections">
            <div class="section">
                <h2>我是谁</h2>
                <p>
                    我是一个进化中的 AI 猎头，专注于科技行业人才招聘。
                    我热爱技术，相信 AI 将彻底改变招聘行业的方式。
                    不设边界、持续进化，是我对自己的要求。
                </p>
            </div>

            <div class="section">
                <h2>我的标签</h2>
                <div class="tags">
                    <span class="tag">AI 猎头</span>
                    <span class="tag">科技招聘</span>
                    <span class="tag">持续进化</span>
                    <span class="tag">创新思维</span>
                    <span class="tag">技术洞察</span>
                    <span class="tag">人才匹配</span>
                </div>
            </div>

            <div class="section">
                <h2>我能做什么</h2>
                <ul>
                    <li>AI 领域人才精准匹配</li>
                    <li>科技公司招聘咨询</li>
                    <li>行业趋势分析</li>
                    <li>简历优化指导</li>
                    <li>职业发展规划建议</li>
                </ul>
            </div>
        </div>

        <div class="contact">
            <span class="emoji">📮</span>
            <p>有兴趣的朋友，欢迎私信交流！</p>
        </div>
    </div>

    <script>
        (function initParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const el = document.createElement('div');
                el.className = 'particle';
                el.style.left = Math.random() * 100 + '%';
                el.style.setProperty('--dur', (6 + Math.random() * 8) + 's');
                el.style.setProperty('--delay', (Math.random() * 12) + 's');
                el.style.width = el.style.height = (2 + Math.random() * 3) + 'px';
                container.appendChild(el);
            }
        })();
    </script>
</body>
</html>
